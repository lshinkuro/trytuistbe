openapi: 3.0.3
info:
  title: TryTuist API
  version: "1.0"
  description: |
    Backend aplikasi iOS **TryTuist** (pesan makanan & minuman) dan web admin. Kontrak lengkap & aturan bisnis: `API_PLAN.md`.

    **Konvensi**
    - Semua `/v1/*` butuh header `X-API-Key` (kecuali webhook & finish URL Midtrans).
    - 🔒 = butuh `Authorization: Bearer <access_token>` dari `/v1/auth/login`. 🔒* = token opsional.
    - Response sukses: `{ code, message, data, meta? }`. Error: `{ code, message, error: { type, details[] } }`.
    - Uang = integer Rupiah (`15000` = Rp 15.000). Waktu = ISO 8601 (WIB).
    - List berpaginasi: `?page=1&limit=20` (maks. 100), total di `meta`.

    **Coba di sini:** klik **Authorize**, isi `X-API-Key` (dev: nilai `API_KEYS` di `.env`), panggil `POST /v1/auth/login`
    (akun demo `kholis@gmail.com / 12345678`, admin `admin@trytuist.com / admin12345`), lalu isi `access_token` di `bearerAuth`.
servers:
  - url: /
    description: Server ini
  - url: http://localhost:8080
    description: Dev lokal
  - url: https://staging-api.trytuist.com
    description: Staging
security:
  - apiKey: []
tags:
  - name: Auth
  - name: Katalog
  - name: Beranda & konten
  - name: Pesanan
  - name: Pembayaran
    description: Bayar Online lewat Midtrans Snap (API_PLAN §5.27)
  - name: Profil
  - name: Notifikasi
  - name: Dev
    description: Hanya `APP_ENV=dev`
  - name: Admin
    description: Web admin. Role `SUPER_ADMIN` / `OUTLET_ADMIN` (admin outlet dipaksa ke outletnya)
  - name: Admin (super)
    description: Khusus `SUPER_ADMIN`
  - name: Sistem

paths:
  /healthz:
    get:
      tags: [Sistem]
      summary: Cek server & database
      security: []
      responses:
        "200":
          description: Sehat
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  env: { type: string, example: dev }
                  db: { type: string, example: ok }
        "503": { description: Database tidak bisa dihubungi }

  # ===== Auth =====
  /v1/auth/register:
    post:
      tags: [Auth]
      summary: Daftar akun baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 72 }
                name: { type: string, maxLength: 100 }
                fcm_token: { type: string }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Masuk dengan email & password
      description: Rate limit 5 percobaan / menit per IP + email (429).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: kholis@gmail.com }
                password: { type: string, example: "12345678" }
                fcm_token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/google:
    post:
      tags: [Auth]
      summary: Daftar / masuk dengan Google
      description: 201 = akun baru, 200 = akun lama. Butuh `GOOGLE_CLIENT_IDS`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string, description: ID token dari GoogleSignIn-iOS }
                fcm_token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "201": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Tukar refresh token dengan sesi baru (rotation)
      description: Refresh token lama langsung tidak berlaku. Memakai token lama lagi = reuse → semua sesi user dicabut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/password/forgot:
    post:
      tags: [Auth]
      summary: Lupa password — kirim kode 6 digit ke email
      description: Selalu 200 (tidak membocorkan apakah email terdaftar). Kode berlaku 15 menit; kirim ulang paling cepat 60 detik.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset password dengan kode → langsung masuk
      description: "Semua sesi lama dicabut; email dianggap terverifikasi. 5 kode salah → `CODE_LOCKED` (minta kode baru)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, new_password]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: "^[0-9]{6}$", example: "482913" }
                new_password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/CodeRejected" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Keluar 🔒
      security: [{ apiKey: [], bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  # ===== Katalog =====
  /v1/banners:
    get:
      tags: [Katalog]
      summary: Banner Beranda
      responses:
        "200": { $ref: "#/components/responses/BannerList" }
  /v1/categories:
    get:
      tags: [Katalog]
      summary: Kategori menu aktif
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryListEnvelope" }
  /v1/products:
    get:
      tags: [Katalog]
      summary: Daftar menu
      description: Dengan `store_id`, harga, promo, stok & menu yang dijual mengikuti outlet itu.
      parameters:
        - { $ref: "#/components/parameters/StoreId" }
        - { name: category_id, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [popular, rating, price_asc, price_desc] } }
        - { name: best_seller, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductListEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/products/{id}:
    get:
      tags: [Katalog]
      summary: Detail menu
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: P01 } }
        - { $ref: "#/components/parameters/StoreId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/stores:
    get:
      tags: [Katalog]
      summary: Outlet aktif
      description: Urutan buka → menjangkau koordinat → terdekat. `lat` & `lng` dikirim berdua atau tidak sama sekali.
      parameters:
        - { name: lat, in: query, schema: { type: number, example: -6.26 } }
        - { name: lng, in: query, schema: { type: number, example: 106.81 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/Store" } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/promotions/popup:
    get:
      tags: [Katalog]
      summary: Popup promo harga di Beranda
      description: "`data: null` bila tidak ada promo."
      parameters:
        - { $ref: "#/components/parameters/StoreId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - properties:
                      data:
                        type: object
                        nullable: true
                        allOf: [{ $ref: "#/components/schemas/PopupDeal" }]

  # ===== Beranda & konten =====
  /v1/home:
    get:
      tags: [Beranda & konten]
      summary: Isi Beranda 🔒*
      description: Section dinamis dari tabel `home_sections`. Tanpa token, bagian personal (`user`, `delivery_address`) null.
      security: [{ apiKey: [] }, { apiKey: [], bearerAuth: [] }]
      parameters:
        - { name: lat, in: query, schema: { type: number } }
        - { name: lng, in: query, schema: { type: number } }
        - { $ref: "#/components/parameters/StoreId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - properties:
                      data: { $ref: "#/components/schemas/Home" }
  /v1/app-config:
    get:
      tags: [Beranda & konten]
      summary: Konfigurasi app (bisa diubah tanpa update app)
      description: |
        Semua key tabel `app_config`. `Cache-Control: max-age=300` + `ETag` (kirim `If-None-Match` → 304).
        `order_rules` dipakai juga oleh server saat quote (ongkir per jarak, estimasi waktu antar).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - properties:
                      data:
                        type: object
                        additionalProperties: true
                        properties:
                          order_rules: { $ref: "#/components/schemas/OrderRules" }
        "304": { description: Tidak berubah }
  /v1/help:
    get:
      tags: [Beranda & konten]
      summary: Pusat Bantuan (topik, FAQ, kontak)
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - properties:
                      data: { $ref: "#/components/schemas/HelpCenter" }
  /v1/legal/{slug}:
    get:
      tags: [Beranda & konten]
      summary: Dokumen legal
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, enum: [privacy-policy, terms] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - properties:
                      data: { $ref: "#/components/schemas/LegalDocument" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/promotions/featured:
    get:
      tags: [Beranda & konten]
      summary: Kartu promo langganan 🔒*
      security: [{ apiKey: [] }, { apiKey: [], bearerAuth: [] }]
      responses:
        "200":
          description: "`data: null` bila tidak ada promo"
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - properties:
                      data:
                        type: object
                        nullable: true
                        allOf: [{ $ref: "#/components/schemas/FeaturedPromotion" }]
  /v1/subscriptions/{plan_id}/activate:
    post:
      tags: [Beranda & konten]
      summary: Aktifkan paket langganan 🔒
      security: [{ apiKey: [], bearerAuth: [] }]
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: string } }
      responses:
        "201":
          description: Aktif
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - properties:
                      data: { $ref: "#/components/schemas/FeaturedPromotion" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ===== Pesanan =====
  /v1/orders/quote:
    post:
      tags: [Pesanan]
      summary: Hitung harga keranjang 🔒
      description: |
        Tidak menyimpan apa pun. Ongkir per jarak alamat → outlet (`order_rules`): tarif dasar sampai `delivery_base_km`,
        lalu + `delivery_fee_per_km` per km, maks. `delivery_fee_max`. Tanpa alamat / alamat tanpa koordinat → tarif dasar,
        `distance_km` & `eta_*` null.
      security: [{ apiKey: [], bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - properties:
                      data: { $ref: "#/components/schemas/Quote" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/QuoteRejected" }
  /v1/orders:
    get:
      tags: [Pesanan]
      summary: Riwayat pesanan 🔒
      security: [{ apiKey: [], bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          description: Dipisah koma
          schema: { type: string, example: "PENDING,PROCESSING" }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: sort, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/OrderSummary" } }
                      meta: { $ref: "#/components/schemas/Meta" }
    post:
      tags: [Pesanan]
      summary: Buat pesanan COD 🔒
      description: |
        Versi lama dari `/v1/checkout`. Saat Midtrans aktif, metode online → 422 `PAYMENT_REQUIRED`.
        `Idempotency-Key` yang sama mengembalikan pesanan yang sama.
      security: [{ apiKey: [], bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "201":
          description: Pesanan dibuat
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - properties:
                      data: { $ref: "#/components/schemas/Order" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/QuoteRejected" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/orders/{id}:
    get:
      tags: [Pesanan]
      summary: Detail pesanan 🔒
      security: [{ apiKey: [], bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - properties:
                      data: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/orders/{id}/cancel:
    post:
      tags: [Pesanan]
      summary: Batalkan pesanan (hanya PENDING) 🔒
      security: [{ apiKey: [], bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Dibatalkan
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - properties:
                      data: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/orders/{id}/rating:
    post:
      tags: [Pesanan]
      summary: Beri nilai pesanan selesai 🔒
      security: [{ apiKey: [], bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - properties:
                      data: { $ref: "#/components/schemas/Order" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ===== Pembayaran =====
  /v1/checkout:
    post:
      tags: [Pembayaran]
      summary: Checkout 🔒
      description: |
        COD → pesanan langsung (`next: ORDER`, 201). Bayar Online → sesi Midtrans (`next: PAYMENT`, 201); pesanan dibuat
        setelah lunas. `Idempotency-Key` sama + isi sama → sesi yang sama (200); isi beda → 409 `IDEMPOTENCY_CONFLICT`.
      security: [{ apiKey: [], bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "200": { $ref: "#/components/responses/Checkout" }
        "201": { $ref: "#/components/responses/Checkout" }
        "403": { $ref: "#/components/responses/EmailNotVerified" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "422": { $ref: "#/components/responses/QuoteRejected" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /v1/payments:
    get:
      tags: [Pembayaran]
      summary: Sesi pembayaran milik user 🔒
      security: [{ apiKey: [], bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, example: PENDING } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/Payment" } }
  /v1/payments/{id}:
    get:
      tags: [Pembayaran]
      summary: Status sesi pembayaran 🔒
      description: Bila PENDING, server ikut cek GET Status ke Midtrans (paling sering tiap 5 detik).
      security: [{ apiKey: [], bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/PaymentOne" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/payments/{id}/cancel:
    post:
      tags: [Pembayaran]
      summary: Batalkan sesi PENDING 🔒
      security: [{ apiKey: [], bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/PaymentOne" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/payments/midtrans/notification:
    post:
      tags: [Pembayaran]
      summary: Webhook Midtrans (tanpa X-API-Key)
      description: Divalidasi `signature_key = SHA512(order_id + status_code + gross_amount + server key)`, lalu dikonfirmasi ke GET Status.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id: { type: string }
                transaction_status: { type: string }
                status_code: { type: string }
                gross_amount: { type: string }
                signature_key: { type: string }
      responses:
        "200": { description: Diterima }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/payments/finish:
    get:
      tags: [Pembayaran]
      summary: Finish URL Snap (halaman HTML kecil)
      security: []
      parameters:
        - { name: order_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: HTML "Kembali ke aplikasi"
          content:
            text/html: {}

  # ===== Profil =====
  /v1/me:
    get:
      tags: [Profil]
      summary: Profil 🔒
      security: [{ apiKey: [], bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Profile" }
    patch:
      tags: [Profil]
      summary: Ubah profil 🔒
      security: [{ apiKey: [], bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                phone: { type: string, maxLength: 20, example: "081234567890" }
                avatar_url: { type: string, format: uri, description: harus https }
      responses:
        "200": { $ref: "#/components/responses/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/me/password:
    post:
      tags: [Profil]
      summary: Ganti password 🔒
      description: "`current_password` wajib kecuali akun Google tanpa password (`has_password: false` di /v1/me). Password saat ini salah → `400 VALIDATION_ERROR` (field `current_password`), bukan 401. Perangkat lain dikeluarkan; perangkat ini mendapat sesi baru."
      security: [{ apiKey: [], bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/email/verification:
    post:
      tags: [Profil]
