        - { name: q, in: query, description: "ID Midtrans, nomor pesanan, nama, atau email", schema: { type: string } }
        - { name: refund, in: query, description: "1 = hanya yang punya refund_status", schema: { type: string, enum: ["1"] } }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/StoreId" }
        - { $ref: "#/components/parameters/Page" }
