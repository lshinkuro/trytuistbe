    get:
      tags: [Admin]
      summary: Detail pembayaran + refund + event Midtrans
      security: [{ apiKey: [], bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/AdminPaymentOne" }
