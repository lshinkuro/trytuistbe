    get:
      tags: [Admin (super)]
      summary: Aturan ongkir per jarak + contoh perhitungan
      description: Disimpan di `app_config.order_rules`. Contoh dihitung dengan fungsi yang sama dengan quote/checkout.
      security: [{ apiKey: [], bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/DeliverySettings" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Admin (super)]
      summary: Ubah aturan ongkir (langsung berlaku)
      description: Field yang tidak dikirim tidak berubah. `delivery_fee_max` harus ≥ `delivery_fee` atau 0. Tercatat di audit log.
      security: [{ apiKey: [], bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliverySettings" }
      responses:
        "200": { $ref: "#/components/responses/DeliverySettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/admin/delivery-settings/preview:
    post:
      tags: [Admin (super)]
      summary: Hitung contoh dari aturan draf (tidak menyimpan)
      security: [{ apiKey: [], bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/DeliverySettings" }
                - type: object
                  properties:
                    preview_subtotal: { type: integer, description: "Subtotal contoh (cek gratis ongkir); 0 = abaikan" }
                    preview_distances: { type: array, maxItems: 20, items: { type: number }, example: [2.5, 8] }
      responses:
        "200": { $ref: "#/components/responses/DeliverySettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/admin/staff:
    get:
      tags: [Admin (super)]
      summary: Akun admin
      security: [{ apiKey: [], bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/Staff" } }
    post:
      tags: [Admin (super)]
      summary: Tambah akun admin
      security: [{ apiKey: [], bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffInput" }
      responses:
        "201": { $ref: "#/components/responses/StaffOne" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/admin/staff/{id}:
    patch:
      tags: [Admin (super)]
      summary: Ubah akun admin (role, outlet, password)
      security: [{ apiKey: [], bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffInput" }
      responses:
        "200": { $ref: "#/components/responses/StaffOne" }
  /v1/admin/customers:
    get:
      tags: [Admin (super)]
      summary: Pelanggan + ringkasan pembelian
      security: [{ apiKey: [], bearerAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/AdminCustomer" } }
                      meta: { $ref: "#/components/schemas/Meta" }
  /v1/admin/audit-logs:
    get:
      tags: [Admin (super)]
      summary: Audit log aksi admin
      security: [{ apiKey: [], bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            action: { type: string, example: PAYMENT_REFUND }
                            entity: { type: string }
                            entity_id: { type: string }
                            summary: { type: string }
                            data: { type: object, additionalProperties: true }
                            admin_name: { type: string, nullable: true }
                            created_at: { type: string, format: date-time }
                      meta: { $ref: "#/components/schemas/Meta" }

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    ProductId: { name: product_id, in: path, required: true, schema: { type: string, example: P01 } }
    StoreId: { name: store_id, in: query, description: "Outlet, mis. ST01", schema: { type: string } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    From: { name: from, in: query, schema: { type: string, format: date, example: "2026-10-01" } }
    To: { name: to, in: query, schema: { type: string, format: date, example: "2026-10-19" } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "Wajib. UUID dari client; retry dengan key yang sama tidak membuat pesanan / sesi ganda (tanpa header → 400)"
      schema: { type: string, format: uuid }

  responses:
    Ok:
      description: OK
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Session:
      description: Sesi login
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Envelope" }
              - properties:
                  data: { $ref: "#/components/schemas/Session" }
    BannerList:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Envelope" }
              - properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Banner" } }
    Profile:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Envelope" }
              - properties:
                  data: { $ref: "#/components/schemas/Profile" }
    AddressOne:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Envelope" }
              - properties:
                  data: { $ref: "#/components/schemas/Address" }
    PaymentMethods:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Envelope" }
              - properties:
                  data: { $ref: "#/components/schemas/PaymentMethodOverview" }
    Checkout:
      description: "`next = ORDER` (COD) atau `PAYMENT` (Bayar Online)"
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Envelope" }
              - properties:
                  data:
                    type: object
                    properties:
                      next: { type: string, enum: [ORDER, PAYMENT] }
                      order: { type: object, allOf: [{ $ref: "#/components/schemas/Order" }], nullable: true }
                      payment: { type: object, allOf: [{ $ref: "#/components/schemas/Payment" }], nullable: true }
    PaymentOne:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Envelope" }
              - properties:
                  data: { $ref: "#/components/schemas/Payment" }
    AdminOrderOne:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Envelope" }
              - properties:
                  data: { $ref: "#/components/schemas/AdminOrder" }
    AdminProductOne:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Envelope" }
              - properties:
                  data: { $ref: "#/components/schemas/AdminProduct" }
    DealOne:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Envelope" }
              - properties:
                  data: { $ref: "#/components/schemas/Deal" }
    AdminStoreOne:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Envelope" }
              - properties:
                  data: { $ref: "#/components/schemas/AdminStore" }
    AdminCategoryOne:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Envelope" }
              - properties:
                  data: { $ref: "#/components/schemas/AdminCategory" }
    StaffOne:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Envelope" }
              - properties:
                  data: { $ref: "#/components/schemas/Staff" }
    AdminPaymentOne:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Envelope" }
              - properties:
                  data: { $ref: "#/components/schemas/AdminPayment" }
    AdminBannerOne:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Envelope" }
              - properties:
                  data: { $ref: "#/components/schemas/AdminBanner" }
    DeliverySettings:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Envelope" }
              - properties:
                  data:
                    type: object
                    properties:
                      settings: { $ref: "#/components/schemas/DeliverySettings" }
                      updated_at: { type: string, format: date-time, nullable: true }
                      examples:
                        type: array
                        items:
                          type: object
                          properties:
                            distance_km: { type: number, example: 5 }
                            delivery_fee: { type: integer, example: 14000 }
                            eta_min_minutes: { type: integer, example: 30 }
                            eta_max_minutes: { type: integer, example: 40 }
    CodeRejected:
      description: "`INVALID_CODE` (salah / kedaluwarsa / sudah dipakai) atau `CODE_LOCKED` (5× salah, minta kode baru)"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    EmailNotVerified:
      description: "`EMAIL_NOT_VERIFIED` — verifikasi email dulu (POST /v1/me/email/verify)"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: "`VALIDATION_ERROR` — detail per field di `error.details`"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: "`UNAUTHORIZED` — token tidak ada / kedaluwarsa (panggil `/v1/auth/refresh`)"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: "`FORBIDDEN` / `INVALID_API_KEY` / `INVALID_SIGNATURE`"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: "`NOT_FOUND`"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Konflik, mis. `EMAIL_ALREADY_REGISTERED`, `IDEMPOTENCY_CONFLICT`, `PAYMENT_ALREADY_FINAL`
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unprocessable:
      description: Aturan bisnis menolak permintaan (lihat `error.type`)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    QuoteRejected:
      description: |
        `EMPTY_CART`, `INVALID_QUANTITY`, `PRODUCT_UNAVAILABLE`, `OUT_OF_STOCK`, `STORE_CLOSED`,
        `OUT_OF_DELIVERY_AREA`, `INVALID_VOUCHER`, `PAYMENT_REQUIRED`, `PAYMENT_METHOD_UNAVAILABLE`, `AMOUNT_TOO_SMALL`,
        `FREE_DELIVERY_UNAVAILABLE` (fitur kupon dimatikan), `FREE_DELIVERY_QUOTA_EXCEEDED` (kupon minggu ini habis)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooManyRequests:
      description: "`RATE_LIMITED` — tunggu sesuai header `Retry-After` (detik)"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadGateway:
      description: "`PAYMENT_GATEWAY_ERROR` — Midtrans gangguan / timeout"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Envelope:
      type: object
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: success }
    Meta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    Error:
      type: object
      properties:
        code: { type: integer, example: 422 }
        message: { type: string, example: Keranjang masih kosong. }
        error:
          type: object
          properties:
            type: { type: string, example: EMPTY_CART }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }

    Session:
      type: object
      properties:
        user_name: { type: string }
        user_image: { type: string }
        access_token: { type: string }
        refresh_token: { type: string }
        expires_at: { type: integer, description: Unix detik }
        is_new_user: { type: boolean }
        email_verified: { type: boolean, description: "false → minta kode verifikasi (dibutuhkan untuk memesan)" }
    BannerAction:
      type: object
      description: "Aksi saat banner di-tap. PRODUCT/CATEGORY: value = id produk/kategori. FREE_DELIVERY: info kupon gratis ongkir mingguan."
      properties:
        type: { type: string, enum: [NONE, PRODUCT, CATEGORY, FREE_DELIVERY] }
        value: { type: string, nullable: true, example: P07 }
    Banner:
      type: object
      description: Hanya banner aktif yang tujuannya berlaku (banner kupon disembunyikan bila kupon dimatikan).
      properties:
        id: { type: string }
        title: { type: string }
        subtitle: { type: string }
        image_url: { type: string }
        action: { $ref: "#/components/schemas/BannerAction" }
    AdminBanner:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        subtitle: { type: string }
        image_url: { type: string }
        action_type: { type: string, enum: [NONE, PRODUCT, CATEGORY, FREE_DELIVERY] }
        action_value: { type: string, nullable: true }
        action_label: { type: string, nullable: true, description: Nama produk / kategori tujuan }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        sort_order: { type: integer }
        is_active: { type: boolean }
        status: { type: string, enum: [LIVE, SCHEDULED, ENDED, INACTIVE, HIDDEN], description: "HIDDEN = dalam periode tapi tujuan tidak berlaku" }
        updated_at: { type: string, format: date-time }
    BannerInput:
      type: object
      properties:
        title: { type: string, maxLength: 80 }
        subtitle: { type: string, maxLength: 120 }
        image_url: { type: string, description: "https://…" }
        action_type: { type: string, enum: [NONE, PRODUCT, CATEGORY, FREE_DELIVERY] }
        action_value: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        clear_schedule: { type: boolean, description: true = tampil tanpa batas waktu }
        sort_order: { type: integer, minimum: 0 }
        is_active: { type: boolean }
    Category:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        icon: { type: string }
    CategoryListEnvelope:
      allOf:
        - { $ref: "#/components/schemas/Envelope" }
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/Category" } }
    ProductOption:
      type: object
      properties:
        id: { type: string, example: large }
        name: { type: string, example: Large }
        extra_price: { type: integer, example: 5000 }
    Product:
      type: object
      properties:
        product_id: { type: string, example: P01 }
        product_name: { type: string, example: Es Kopi Susu Gula Aren }
        description: { type: string }
        category_id: { type: string }
        price: { type: integer, description: Harga berlaku (sudah termasuk promo), example: 22000 }
        original_price: { type: integer, nullable: true, description: Harga normal bila sedang promo }
        discount_percent: { type: integer }
        image_url: { type: string }
        rating: { type: number }
        sold_count: { type: integer }
        is_available: { type: boolean }
        tags: { type: array, items: { type: string } }
        options: { type: array, items: { $ref: "#/components/schemas/ProductOption" } }
        combo:
          type: object
          nullable: true
          description: "Paket isi tetap. Habis bila salah satu isinya habis di outlet; stok isi ikut terpotong."
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/BundleItem" } }
            separate_price: { type: integer, description: Total bila isinya dibeli satuan, example: 48000 }
            savings: { type: integer, example: 9000 }
    BundleItem:
      type: object
      properties:
        product_id: { type: string }
        product_name: { type: string }
        option_id: { type: string, nullable: true }
        option_name: { type: string, nullable: true }
        quantity: { type: integer, description: Per 1 paket }
    ProductEnvelope:
      allOf:
        - { $ref: "#/components/schemas/Envelope" }
        - properties:
            data: { $ref: "#/components/schemas/Product" }
    ProductListEnvelope:
      allOf:
        - { $ref: "#/components/schemas/Envelope" }
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/Product" } }
            meta: { $ref: "#/components/schemas/Meta" }
    PopupDeal:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        subtitle: { type: string }
        badge: { type: string }
        image_url: { type: string }
        ends_at: { type: string, format: date-time }
        product: { $ref: "#/components/schemas/Product" }
    Store:
      type: object
      properties:
        id: { type: string, example: ST01 }
        name: { type: string, example: Gandaria City }
        address: { type: string }
        lat: { type: number }
        lng: { type: number }
        phone: { type: string, nullable: true }
        is_open: { type: boolean }
        opens_at: { type: string, example: "08:00" }
        closes_at: { type: string, example: "22:00" }
        hours_label: { type: string, example: "08:00–22:00" }
        delivery_radius_km: { type: number }
        distance_km: { type: number, nullable: true }
        is_deliverable: { type: boolean, nullable: true }
        closed_note: { type: string, nullable: true }
    Home:
      type: object
      properties:
        greeting: { type: string, example: Selamat pagi }
        user:
          type: object
          nullable: true
          properties:
            name: { type: string }
            points: { type: integer }
            voucher_count: { type: integer }
        delivery_address:
          type: object
          nullable: true
          properties:
            id: { type: string }
            label: { type: string }
            address: { type: string }
        store:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
            is_open: { type: boolean }
            hours_label: { type: string }
            closed_note: { type: string, nullable: true }
        sections:
          type: array
          description: Bentuk per `type` (banner, kategori, produk, …) — lihat API_PLAN §5.18
          items: { type: object, additionalProperties: true }
    OrderRules:
      type: object
      properties:
        min_quantity: { type: integer, example: 1 }
        max_quantity: { type: integer, example: 20 }
        max_note_length: { type: integer, example: 100 }
        delivery_fee: { type: integer, description: Tarif dasar, example: 10000 }
        free_delivery_min_subtotal: { type: integer, description: 0 = nonaktif }
        delivery_base_km: { type: number, example: 3 }
        delivery_fee_per_km: { type: integer, description: 0 = ongkir flat, example: 2000 }
        delivery_fee_max: { type: integer, description: 0 = tanpa batas, example: 30000 }
        prep_minutes: { type: integer, example: 15 }
        courier_speed_kmh: { type: number, example: 20 }
        free_delivery_coupon_enabled: { type: boolean }
        free_delivery_coupon_weekly: { type: integer, example: 2 }
    HelpCenter:
      type: object
      properties:
        query: { type: string, nullable: true }
        operating_hours: { type: string }
        topics:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              icon: { type: string }
              articles:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    question: { type: string }
                    answer: { type: string }
                    updated_at: { type: string, format: date-time }
        contacts:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [WHATSAPP, EMAIL, PHONE] }
              label: { type: string }
              value: { type: string }
              icon: { type: string }
              url: { type: string }
    LegalDocument:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        version: { type: string }
        summary: { type: string, nullable: true }
        sections:
          type: array
          items:
            type: object
            properties:
              heading: { type: string }
              body: { type: string }
        effective_at: { type: string, format: date }
        updated_at: { type: string, format: date-time }
    FeaturedPromotion:
      type: object
      properties:
        plan_id: { type: string }
        eyebrow: { type: string }
        title: { type: string }
        price: { type: integer }
        period: { type: string, enum: [DAILY, WEEKLY, MONTHLY] }
        image_url: { type: string, nullable: true }
        is_active: { type: boolean }
        active_until: { type: string, format: date-time, nullable: true }

    DeliverySettings:
      type: object
      properties:
        delivery_fee: { type: integer, minimum: 0, description: Tarif dasar, example: 10000 }
        delivery_base_km: { type: number, minimum: 0, maximum: 50, description: Jarak yang tercakup tarif dasar, example: 3 }
        delivery_fee_per_km: { type: integer, minimum: 0, description: "Per km berikutnya (dibulatkan ke atas); 0 = flat", example: 2000 }
        delivery_fee_max: { type: integer, minimum: 0, description: "0 = tanpa batas", example: 30000 }
        free_delivery_min_subtotal: { type: integer, minimum: 0, description: "Gratis ongkir bila subtotal ≥ nilai ini; 0 = nonaktif" }
        prep_minutes: { type: integer, minimum: 0, maximum: 240, example: 15 }
        courier_speed_kmh: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 120, example: 20 }
        free_delivery_coupon_enabled: { type: boolean, description: Fitur kupon gratis ongkir mingguan }
        free_delivery_coupon_weekly: { type: integer, minimum: 1, maximum: 14, example: 2 }
    OrderItemInput:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: { type: string, example: P01 }
        option_id: { type: string, nullable: true, example: large }
        quantity: { type: integer, example: 2 }
        note: { type: string, maxLength: 100, example: less sugar }
    QuoteRequest:
      type: object
      required: [items]
      properties:
