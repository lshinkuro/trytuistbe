  /v1/admin/payments/{id}/refund:
    post:
      tags: [Admin (super)]
      summary: Refund penuh / sebagian / manual
      description: |
        Status pesanan tidak diubah otomatis. VA & gerai tidak bisa lewat Midtrans → kirim `manual: true`
        setelah dana ditransfer balik. Error: 409 `PAYMENT_NOT_PAID`, 422 `REFUND_AMOUNT_INVALID` /
        `REFUND_NOT_SUPPORTED` / `REFUND_REJECTED` / `PAYMENT_METHOD_UNAVAILABLE`, 502 `PAYMENT_GATEWAY_ERROR`.
      security: [{ apiKey: [], bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                amount: { type: integer, minimum: 0, description: "0 / kosong = seluruh sisa", example: 20000 }
                reason: { type: string, maxLength: 300, example: Menu habis }
                manual: { type: boolean, default: false }
      responses:
        "200": { $ref: "#/components/responses/AdminPaymentOne" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "502": { $ref: "#/components/responses/BadGateway" }
